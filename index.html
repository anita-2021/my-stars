.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}

.nav button span{display:block;font-size:24px}
.nav button.on{color:var(--pr);font-weight:bold}
.bar{height:16px;background:var(--bd);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pk));border-radius:10px;transition:width .5s}
.big{font-size:44px;text-align:center}

.box{font-size:64px;background:none;border:0;animation:bob 1.6s infinite ease-in-out}
.box:nth-child(2){animation-delay:.3s}.box:nth-child(3){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
.reveal{text-align:center;font-size:24px;padding:16px;animation:pop .6s}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.fl{position:fixed;font-size:28px;pointer-events:none;animation:up 1.1s ease-out forwards;z-index:9}
@keyframes up{to{transform:translateY(-140px) scale(1.6);opacity:0}}
input,textarea{width:100%;font:inherit;padding:10px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}
textarea{height:120px}
.btn{width:100%;padding:12px;border:0;border-radius:14px;background:var(--bd);color:var(--tx);font:inherit;font-size:15px;margin-top:8px}
.btn.d{background:var(--rd);color:#fff}
.wk{display:flex;gap:4px;align-items:flex-end;height:120px;margin-top:8px}
.wk div{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.wk i{display:block;border-radius:8px 8px 0 0;background:linear-gradient(var(--pk),var(--pr));margin-bottom:3px}
.wk i.neg{background:var(--rd)}
.msg{text-align:center;color:var(--mu);padding:8px;font-size:14px}
.av{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:18px;padding:4px 12px;font:inherit;font-size:26px;line-height:1.1}
.av small{display:block;font-size:11px}
.av.on{background:linear-gradient(135deg,var(--pr),var(--pk));color:#fff;border-color:transparent}
.kids{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.cf{position:fixed;top:-20px;border-radius:2px;pointer-events:none;z-index:20;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.pet{animation:bob 2.2s infinite ease-in-out;line-height:1.2}
.row input{flex:1;min-width:0}
</style>

function clone(o){return JSON.parse(JSON.stringify(o))}
function t(k){return T[S.lang][k]}
function f(s,o){return s.replace(/\{(\w)\}/g,function(m,k){return o[k]})}

+'<div class="card"><label>'+t('pgf')+'</label><textarea onchange="S.gifts=this.value.split(\'\\n\').filter(Boolean);save()">'+S.gifts.join('\n')+'</textarea></div>'
+'<div class="card"><button class="btn" onclick="S.test=!S.test;save();render()">'+t(S.test?'ton':'toff')+'</button><button class="btn" onclick="delete C().claimed[WK];save();render()">'+t('reo')+'</button><button class="btn d" onclick="resetAll()">'+t(rs?'rs2':'rs')+'</button></div>'}
function resetAll(){if(!rs){rs=1;render();setTimeout(function(){if(rs){rs=0;render()}},4000);return}var l=S.lang;S=clone(def);S.lang=l;fix();rs=0;unl=false;save();render()}
function setL(l){S.lang=l;save();render()}
var AV=['🦄','🐱','🐶','🦊','🐼','🐯','🐰','🐸','🦁','🐵'],PETS=[['🥚','🐣','🐥','🦆','🦚'],['🥚','🦎','🐊','🐲','🐉'],['🥚','🐛','🐝','🦋','🧚']];
function mk(n,a){return{name:n,av:a,pet:0,days:{},claimed:{}}}
function fix(){if(!S.kids||!S.kids.length){var k=mk(S.kid||'','🦄');if(S.days)k.days=S.days;if(S.claimed)k.claimed=S.claimed;S.kids=[k];S.cur=0}delete S.days;delete S.claimed;delete S.kid;if(!S.kids[S.cur])S.cur=0}
function C(){return S.kids[S.cur]||S.kids[0]}
function e(x){return (x||'').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function tot(){var n=0,d=C().days;for(var k in d)n+=sc(d[k]).pos;return n}
function pet(){var P=PETS[C().pet||0],n=tot(),th=[0,10,30,60,100],i=0;th.forEach(function(x,j){if(n>=x)i=j});var nx=th[i+1],p=nx?(n-th[i])/(nx-th[i])*100:100;
return '<div class="card" style="text-align:center"><div class="pet" style="font-size:'+(54+i*12)+'px">'+P[i]+'</div><b>'+t('st')[i]+'</b><div class="bar" style="margin:8px 0 4px"><i style="width:'+p+'%"></i></div><small style="color:var(--mu)">'+(nx?f(t('nx'),{n:nx-n}):t('mx'))+'</small></div>'}
function chips(){if(tab=='parent'||S.kids.length<2)return '';return '<div class="kids">'+S.kids.map(function(k,i){return '<button class="av '+(i==S.cur?'on':'')+'" onclick="setK('+i+')">'+k.av+'<small>'+(k.name||t('kid'))+'</small></button>'}).join('')+'</div>'}
function setK(i){S.cur=i;save();render()}
function kidsUI(){var h='<b>'+t('kids')+'</b>';S.kids.forEach(function(k,i){h+='<div class="row"><button class="chk" onclick="cyc('+i+',\'av\')">'+k.av+'</button><input value="'+e(k.name)+'" placeholder="'+t('kid')+'" onchange="S.kids['+i+'].name=this.value;save()"><button class="chk" onclick="cyc('+i+',\'pet\')">'+PETS[k.pet||0][3]+'</button>'+(S.kids.length>1?'<button class="chk" onclick="delK('+i+')">'+(dl===i?'⚠️':'🗑️')+'</button>':'')+'</div>'});return h+'<button class="btn" onclick="addK()">➕ '+t('add')+'</button><br><br>'}
function cyc(i,w){var k=S.kids[i];if(w=='av')k.av=AV[(AV.indexOf(k.av)+1)%AV.length];else k.pet=((k.pet||0)+1)%PETS.length;save();render()}
function delK(i){if(dl!==i){dl=i;render();setTimeout(function(){if(dl===i){dl=-1;render()}},4000);return}S.kids.splice(i,1);S.cur=0;dl=-1;save();render()}
function addK(){S.kids.push(mk('',AV[S.kids.length%AV.length]));save();render()}
function chk(el){if(el.value.length==4){if(el.value==S.pin){unl=true;render()}else{el.value='';el.placeholder='❌'}}}
function render(){clock();var fa=S.lang=='fa',d=document.documentElement;d.lang=S.lang;d.dir=fa?'rtl':'ltr';document.title='⭐ '+t('app');
var v={today:vToday,week:vWeek,gift:vGift,parent:vParent}[tab]();
var lg='<div class="lang">'+[['fa','دری'],['en','EN'],['de','DE']].map(function(l){return '<button class="'+(S.lang==l[0]?'on':'')+'" onclick="setL(\''+l[0]+'\')">'+l[1]+'</button>'}).join('')+'</div>';
document.getElementById('app').innerHTML=lg+chips()+v;
var n=[['today','📝'],['week','📊'],['gift','🎁'],['parent','👨‍👩‍👧']];
document.getElementById('nav').innerHTML=n.map(function(x,i){return '<button class="'+(tab==x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+t('n')[i]+'</button>'}).join('')}
function go(x){if(x!='parent')unl=false;tab=x;render();window.scrollTo(0,0)}
render();
setInterval(function(){if(dk(new Date())!=TK)render()},30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&dk(new Date())!=TK)render()});
</script>
</body>
</html>
